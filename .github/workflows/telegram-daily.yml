name: Telegram Daily Summary

# Cron en UTC. El script comprueba si la hora local Madrid coincide con
# notif.time, así que solo envía 1 vez al día (cuando la hora coincide).
# Por defecto se ejecuta cada hora en :15 — si tu hora configurada es
# 09:00 Madrid, el run de las 08:15 UTC (= 09:15 verano / 10:15 invierno)
# o 07:15 UTC (= 09:15 invierno / 08:15 verano) detectará el match.
# El script se ejecuta cada hora pero solo envía si Madrid hour == notif.time hour.
on:
  schedule:
    - cron: '15 * * * *'   # cada hora a y 15
  workflow_dispatch:        # permite ejecutar manualmente desde la UI
    inputs:
      force:
        description: 'Forzar envío aunque no toque por hora'
        required: false
        default: 'false'
      type:
        description: 'Tipo a forzar: daily | weekly | both (vacío = ambos según schedule)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run telegram summary script
        env:
          APPDATA_PAT: ${{ secrets.APPDATA_PAT }}
          FORCE: ${{ github.event.inputs.force }}
          FORCE_TYPE: ${{ github.event.inputs.type }}
        run: node .github/scripts/telegram-summary.js
