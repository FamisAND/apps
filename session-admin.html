<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios y sesiones - Full Training</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f5f7f8;color:#182228;letter-spacing:0}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d7dfe2;display:flex;align-items:center;gap:24px}a{color:#12705d}h1{font-size:20px;margin:0}main{max-width:1200px;margin:auto;padding:24px 24px 90px}h2{font-size:16px;margin:28px 0 14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:8px;border:1px solid #b7c5cb;border-radius:4px}button{cursor:pointer;background:#fff;color:#182228}button.primary{background:#176851;color:#fff;border-color:#176851}button.danger{color:#ad2424}button:disabled{opacity:.55;cursor:wait}label{display:flex;gap:6px;align-items:center}input[type=checkbox]{accent-color:#176851}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;border-bottom:1px solid #d7dfe2;padding:12px 10px;vertical-align:top}th{font-size:12px;color:#58666c}.table-wrap{overflow:auto}td .row{gap:6px}.status{min-height:24px;color:#ad2424;margin-top:14px}.muted{color:#58666c;font-size:12px}.permissions{display:flex;gap:10px;flex-wrap:wrap;max-width:430px}.permissions label{font-size:12px}section{margin-top:24px;border-top:1px solid #d7dfe2}@media(max-width:600px){main{padding:16px 12px 90px}header{padding:16px 12px}input[type=email],input[type=text]{width:100%}th,td{padding:10px 8px}}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.setting{display:grid;grid-template-columns:auto 82px auto;gap:10px;font-size:13px}.setting input{width:82px}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:3px;background:#e9edef;color:#58666c;font-size:11px;white-space:nowrap}.badge.active{background:#e2f4ec;color:#176851}.session-changes{border:0;color:#126b83;display:flex;gap:8px;align-items:center;padding:4px 0;background:transparent}.session-modules{font-size:11px;line-height:1.5;color:#687b83;margin-top:6px;max-width:210px}.activity-detail>td{background:#f7faf9;padding:20px}.activity-list{margin:0;padding:0;list-style:none;display:grid;gap:18px}.activity-event{display:grid;grid-template-columns:160px 1fr;gap:16px}.activity-event time{font-size:12px;color:#687b83}.activity-event ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6}.activity-event li{overflow-wrap:anywhere}.activity-event small{color:#687b83}.activity-empty{color:#687b83;margin:0}.row button .ft-icon{vertical-align:middle}.status:empty{min-height:0;margin:0}.session-policy-saved{color:#176851}section:first-child{border-top:0;margin-top:0}header{justify-content:space-between}main{max-width:1320px}h2{font-weight:600}.permissions label{white-space:nowrap}
@media(max-width:800px){.sessions-table thead{display:none}.sessions-table,.sessions-table tbody,.sessions-table tr,.sessions-table td{display:block}.sessions-table tr{padding:8px 0;border-bottom:1px solid #d7dfe2}.sessions-table td{border:0;padding:6px 12px}.sessions-table td[data-label]::before{content:attr(data-label);display:inline-block;width:120px;font-size:11px;color:#687b83}.sessions-table .activity-detail{padding:0}.activity-event{grid-template-columns:1fr;gap:6px}.setting{grid-template-columns:1fr 70px auto;width:100%}.setting input{width:70px}}
[hidden]{display:none!important}
@media(max-width:800px){#users{display:block}table:has(#users) thead{display:none}table:has(#users),#users tr,#users td{display:block}#users tr{padding:10px;border-bottom:1px solid #d7dfe2}#users td{border:0;padding:8px 0}#users td::before{content:attr(data-label);display:block;font-size:11px;color:#687b83;margin-bottom:6px}}
</style></head>
<body><header><a href="index.html">Inicio</a><h1>Usuarios y sesiones</h1></header><main>
<section><h2>Nuevo usuario</h2><form id="createUser"><div class="row"><input id="newName" type="text" placeholder="Nombre" required maxlength="100" aria-label="Nombre"><input id="newEmail" type="email" placeholder="Correo" required aria-label="Correo"><button class="primary" type="submit">Crear usuario</button></div><div id="newPermissions" class="permissions" style="margin-top:12px"></div></form></section>
<div id="status" class="status" role="status"></div>
<section><div class="row"><h2>Usuarios</h2><button id="refresh" type="button">Actualizar</button></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Rol y estado</th><th>Acceso</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><div class="section-heading"><h2>Ultimas 10 sesiones</h2><span id="sessionCount" class="muted"></span></div><div class="table-wrap"><table class="sessions-table"><thead><tr><th>Usuario</th><th>Inicio</th><th>Ultima actividad</th><th>Estado</th><th>Cambios confirmados</th></tr></thead><tbody id="sessions"></tbody></table></div></section>
<section><h2>Tiempo de sesion</h2><form id="sessionPolicy" class="row"><label class="setting">Cerrar por inactividad<input id="idleMinutes" type="number" min="5" max="480" step="1" required><span class="muted">minutos</span></label><label class="setting">Duracion maxima<input id="maxHours" type="number" min="1" max="24" step="1" required><span class="muted">horas</span></label><button class="primary" type="submit">Guardar tiempos</button></form><p id="policyStatus" class="muted" role="status"></p></section>
</main><script src="session-admin.js"></script></body></html>
